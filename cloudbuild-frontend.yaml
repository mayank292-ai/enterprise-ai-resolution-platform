steps:
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --no-cache
      - --build-arg
      - VITE_API_BASE_URL=${_BACKEND_URL}
      - -t
      - ${_FRONTEND_IMAGE}
      - ./frontend

  - id: inspect-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - image
      - inspect
      - ${_FRONTEND_IMAGE}

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_FRONTEND_IMAGE}

substitutions:
  _BACKEND_URL: https://placeholder.example
  _FRONTEND_IMAGE: us-central1-docker.pkg.dev/placeholder/finsightai/frontend:v2

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s