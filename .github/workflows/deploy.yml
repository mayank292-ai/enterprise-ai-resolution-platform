name: Deploy FinSightAI to Cloud Run

on:
  # Deployment is intentionally manual in the public portfolio repository.
  workflow_dispatch:

# Prevent two deployments from running simultaneously.
concurrency:
  group: finsightai-production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || 'http://localhost:5173' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
      CLOUD_BUILD_CONFIG: cloudbuild.yaml

    steps:
      # Checkout must happen before Google authentication.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Google Cloud authentication
        run: |
          set -euo pipefail

          echo "Authenticated Google Cloud account:"
          gcloud auth list --filter=status:ACTIVE \
            --format="value(account)"

          echo "Google Cloud project:"
          gcloud config get-value project

      - name: Validate deployment files
        run: |
          set -euo pipefail

          for variable_name in \
            PROJECT_ID \
            WORKLOAD_IDENTITY_PROVIDER \
            DEPLOY_SERVICE_ACCOUNT \
            RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!variable_name}" ]]; then
              echo "ERROR: Configure the ${variable_name} repository variable."
              exit 1
            fi
          done

          test -f "${CLOUD_BUILD_CONFIG}" || {
            echo "ERROR: ${CLOUD_BUILD_CONFIG} was not found."
            exit 1
          }

          test -f backend/Dockerfile || {
            echo "ERROR: backend/Dockerfile was not found."
            exit 1
          }

          test -f frontend/Dockerfile || {
            echo "ERROR: frontend/Dockerfile was not found."
            exit 1
          }

          echo "Required deployment files are present."

      - name: Submit deployment to Cloud Build
        id: cloud-build
        run: |
          set -euo pipefail

          echo "Submitting commit ${GITHUB_SHA} to Cloud Build..."

          gcloud builds submit . \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --config="${CLOUD_BUILD_CONFIG}" \
            --substitutions="COMMIT_SHA=${GITHUB_SHA},_RUNTIME_SERVICE_ACCOUNT=${RUNTIME_SERVICE_ACCOUNT},_ALLOWED_ORIGINS=${FRONTEND_ORIGIN},_GEMINI_MODEL=${GEMINI_MODEL}"

      - name: Show deployed services
        if: success()
        run: |
          set -euo pipefail

          echo "FinSightAI deployment completed successfully."
          echo

          gcloud run services describe finsightai-backend \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format="table(
              metadata.name:label=SERVICE,
              status.url:label=URL,
              status.latestReadyRevisionName:label=REVISION
            )"

          echo

          gcloud run services describe finsightai-frontend \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format="table(
              metadata.name:label=SERVICE,
              status.url:label=URL,
              status.latestReadyRevisionName:label=REVISION
            )"
